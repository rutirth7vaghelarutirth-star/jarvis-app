<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. // SUPREME APP CORE</title>
  <link rel="manifest" href="./manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #03080e;
            color: #00f0ff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            border: 2px solid #00f0ff;
            box-shadow: inset 0 0 40px rgba(0, 240, 255, 0.3);
            background-image: linear-gradient(rgba(0,240,255,0.02) 1px, transparent 1px);
            background-size: 100% 4px;
        }

        .top-hud {
            display: flex;
            justify-content: space-between;
            font-size: 8.5px;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.4);
            padding-bottom: 6px;
            text-shadow: 0 0 6px #00f0ff;
        }

        .main-stage {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* 60-लेयर सिक्योरिटी बायोमेट्रिक लॉक स्क्रीन */
        #authScreen {
            position: absolute;
            width: 100%; height: 100%;
            background: rgba(2, 5, 10, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .auth-card {
            border: 1px solid #00f0ff;
            background: rgba(0, 15, 25, 0.9);
            padding: 22px;
            border-radius: 8px;
            width: 85%;
            max-width: 310px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
        }

        .biometric-scanner {
            width: 65px; height: 65px;
            border: 2px solid #00f0ff;
            border-radius: 50%;
            margin: 0 auto 12px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            animation: jarvisPulse 1.5s infinite;
        }
        @keyframes jarvisPulse { 0% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.7); } 100% { box-shadow: 0 0 0 18px rgba(0, 240, 255, 0); } }

        /* जार्विस सुप्रीम आर्क रिएक्टर */
        #jarvisInterface {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: absolute;
        }

        .reactor-wrapper {
            position: relative;
            width: 190px; height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .ring-outer {
            position: absolute;
            width: 220px; height: 220px;
            border: 1px dashed rgba(0, 240, 255, 0.6);
            border-radius: 50%;
            animation: spinCW 10s linear infinite;
        }
        .ring-mid {
            position: absolute;
            width: 175px; height: 175px;
            border: 2px solid rgba(0, 240, 255, 0.9);
            border-left: 2px solid transparent;
            border-radius: 50%;
            animation: spinCCW 4s linear infinite;
        }
        .ring-core-glow {
            width: 80px; height: 80px;
            background: radial-gradient(circle, #ffffff 0%, #00f0ff 60%, #000b22 100%);
            border-radius: 50%;
            box-shadow: 0 0 45px #00f0ff, 0 0 20px #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: coreHeartbeat 1s ease-in-out infinite alternate;
        }

        @keyframes spinCW { 100% { transform: rotate(360deg); } }
        @keyframes spinCCW { 100% { transform: rotate(-360deg); } }
        @keyframes coreHeartbeat { 0% { transform: scale(0.95); } 100% { transform: scale(1.05); } }

        /* बॉटम कमांड डॉक */
        .control-dock {
            background: rgba(0, 10, 20, 0.95);
            border: 1px solid rgba(0, 240, 255, 0.7);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 150;
        }

        .matrix-info {
            font-size: 7.5px;
            color: #00ffcc;
            letter-spacing: 1.5px;
            text-align: center;
        }

        .action-row {
            display: flex;
            gap: 6px;
        }

        .cmd-box {
            flex-grow: 1;
            background: #000;
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 6px;
            font-size: 9px;
            border-radius: 4px;
            outline: none;
        }

        .exec-btn {
            background: rgba(0, 240, 255, 0.3);
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 6px 12px;
            font-size: 9px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="top-hud">
        <span>MASTER: RUTIRTH</span>
        <span>JARVIS // 160-MODS CORE</span>
        <span id="coreState">STATUS: SECURED</span>
    </div>

    <div class="main-stage">
        <!-- बायोमेट्रिक / फिंगरप्रिंट लॉक स्क्रीन -->
        <div id="authScreen">
            <div class="auth-card">
                <div class="biometric-scanner" onclick="bypassSecurity()">👆</div>
                <div style="font-size: 9px; color: #00f0ff; margin-bottom: 6px; letter-spacing: 1px; font-weight: bold;">MASTER BIOMETRIC VAULT</div>
                <div style="font-size: 7px; color: #aaccff; margin-bottom: 12px;">Tap scanner or say override to initialize JARVIS.</div>
                <div id="authStatus" style="font-size: 7.5px; color: #00ffaa; font-weight: bold; margin-bottom: 10px;">Waiting for Master Rutirth...</div>
                <button style="background: rgba(0,240,255,0.2); border: 1px solid #00f0ff; color: #00f0ff; padding: 7px; font-size: 8px; width: 100%; border-radius: 4px; cursor: pointer; font-weight: bold;" onclick="bypassSecurity()">INITIALIZE JARVIS APP</button>
            </div>
        </div>

        <!-- जार्विस सुप्रीम आर्क रिएक्टर -->
        <div id="jarvisInterface">
            <div class="reactor-wrapper" onclick="activateJarvisListening()">
                <div class="ring-outer"></div>
                <div class="ring-mid"></div>
                <div class="ring-core-glow">
                    <span style="font-size: 9px; font-weight: bold; color: #000;">JARVIS</span>
                </div>
            </div>
            <div id="jarvisSpeechLog" style="font-size: 8px; color: #aaffff; margin-top: 18px; text-align: center; padding: 0 12px; letter-spacing: 1px;">
                JARVIS CORE ACTIVE. TAP REACTOR TO SPEAK.
            </div>
        </div>
    </div>

    <div class="control-dock">
        <div class="matrix-info">160-MODULES SUPREME MATRIX: ONLINE</div>
        <div class="action-row">
            <input type="text" id="userInput" class="cmd-box" placeholder="Enter command or study query...">
            <button class="exec-btn" onclick="executeManualCommand()">EXEC</button>
        </div>
    </div>

    <script>
        // जार्विस की भारी और खूंखार मूवी-वॉइस इंजन
        function speakJarvis(text) {
            document.getElementById('jarvisSpeechLog').innerHTML = `<span style="color:#00ffaa;">JARVIS: ${text}</span>`;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                utterance.pitch = 0.5;   // एकदम भारी और डीप मूवी वॉइस
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // फिंगरप्रिंट / बायोमेट्रिक बाईपास और ऐप ओपनिंग
        function bypassSecurity() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('jarvisInterface').style.display = 'flex';
            document.getElementById('coreState').innerText = "STATUS: ACTIVE";
            speakJarvis("वेलकम बैक, मास्टर रुतीर्थ। जार्विस सुप्रीम कोर पूरी तरह एक्टिव है। हुक्म दीजिए, सर।");
        }

        function activateJarvisListening() {
            speakJarvis("बोलिए मास्टर, कौन सा मॉड्यूल एक्टिव करना है?");
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SpeechRecognition) return;
            const rec = new SpeechRecognition();
            rec.lang = 'hi-IN';
            rec.onresult = function(e) {
                const cmd = e.results[0][0].transcript.toLowerCase();
                document.getElementById('userInput').value = cmd;
                executeManualCommand();
            };
            rec.start();
        }

        function executeManualCommand() {
            const inputField = document.getElementById('userInput');
            const cmd = inputField.value.trim().toLowerCase();
            if(!cmd) return;

            if(cmd.includes('time') || cmd.includes('समय')) {
                speakJarvis(`वर्तमान समय ${new Date().toLocaleTimeString()} हो रहा है, मास्टर।`);
            } else if(cmd.includes('security') || cmd.includes('सुरक्षा')) {
                speakJarvis("सभी सुरक्षा लेयर्स फुल एक्टिवेशन में हैं। सिस्टम पूरी तरह सुरक्षित है।");
            } else {
                speakJarvis(`आपकी कमांड '${cmd}' पर प्रोसेसिंग जारी है, मास्टर।`);
            }
            inputField.value = "";
        }
    </script>
</body>
</html>
